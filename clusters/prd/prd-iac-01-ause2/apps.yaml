apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/elayaraja-kv/k8s-as-code.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: "app-{{path.basename}}"
      labels:
        cluster: prd-iac-01-ause2
        env: prd
        type: app
    spec:
      project: default
      source:
        repoURL: https://github.com/elayaraja-kv/k8s-as-code.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      # Prd: no auto-sync — changes require manual approval
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
