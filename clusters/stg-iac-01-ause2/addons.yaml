apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/elayaraja-kv/k8s-as-code.git
        revision: main
        directories:
          - path: addons/*
          - path: addons/cert-manager
            exclude: true
          - path: addons/google-cas-issuer
            exclude: true
  template:
    metadata:
      name: "addon-{{path.basename}}"
      labels:
        cluster: stg-iac-01-ause2
        type: addon
      annotations:
        # Wave 0 — syncs after wave -1 prereqs (cert-manager, google-cas-issuer) are Healthy
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/elayaraja-kv/k8s-as-code.git
        targetRevision: main
        path: "{{path}}"
        helm:
          valueFiles:
            - values.yaml
            - values-stg.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas # allow HPA to manage replicas
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: httproutes.gateway.networking.k8s.io
          jsonPointers:
            - /spec/versions
            - /status/storedVersions # GKE-managed CRD — do not reconcile
