apiVersion: v2
name: linkerd
description: Linkerd service mesh — CRDs + control plane (umbrella chart)
type: application
version: 1.0.0

# Linkerd edge Helm charts: https://helm.linkerd.io/edge
# Edge channel provides native sidecar support (required for GKE Autopilot).
# Check latest versions: helm search repo linkerd-edge/linkerd-crds --versions
#                        helm search repo linkerd-edge/linkerd-control-plane --versions
#
# Dependencies are installed in order: linkerd-crds first, then linkerd-control-plane.
# This satisfies the CRD-before-controller ordering requirement.
dependencies:
  - name: linkerd-crds
    version: "2026.3.1"
    repository: https://helm.linkerd.io/edge

  - name: linkerd-control-plane
    version: "2026.3.1"
    repository: https://helm.linkerd.io/edge
