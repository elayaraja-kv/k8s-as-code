---
# cert-manager Certificate — requests the Linkerd identity issuer cert from the
# local trust anchor ClusterIssuer (addons/linkerd/templates/cluster-issuer.yaml).
# cert-manager writes the cert+key into 'linkerd-identity-issuer' secret (TLS type),
# which Linkerd reads via identity.issuer.scheme: kubernetes.io/tls.
# Rotation happens automatically before expiry (renewBefore: 25h).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-identity-issuer
  namespace: linkerd
spec:
  secretName: linkerd-identity-issuer
  duration: 48h
  renewBefore: 25h
  issuerRef:
    name: linkerd-trust-anchor     # ClusterIssuer in addons/linkerd/templates/cluster-issuer.yaml
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: identity.linkerd.cluster.local
  dnsNames:
    - identity.linkerd.cluster.local
  isCA: true
  privateKey:
    algorithm: ECDSA
  usages:
    - cert sign
    - crl sign
    - server auth
    - client auth
