  #   --profile root-ca --no-password --insecure --kty EC --curve P-256
  # Store ca.key in GCP Secret Manager — never commit it.
  identityTrustAnchorsPEM: |
    # TODO: replace with prd trust anchor PEM
    # -----BEGIN CERTIFICATE-----
    # ...
    # -----END CERTIFICATE-----

  clusterDomain: cluster.local
